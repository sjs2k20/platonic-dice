name: Bump package versions on PR label

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

env:
  PUBLISHABLE_PACKAGES: "packages/core packages/types-core packages/dice"
  ALLOWED_LABELS: "semver/patch,semver/minor,semver/major"

jobs:
  bump-on-label:
    if: |
      github.event.label.name == 'semver/patch' ||
      github.event.label.name == 'semver/minor' ||
      github.event.label.name == 'semver/major'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "8.15.9"
          cache: true

      - name: Verify label is allowed
        id: check_label
        run: |
          set -euo pipefail
          LABEL=${{ github.event.label.name }}
          echo "label=$LABEL"
          case ",${ALLOWED_LABELS}," in
            *",$LABEL,") echo "ok" ;;
            *) echo "Label '$LABEL' is not allowed; exiting."; exit 0 ;;
          esac
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Ensure PR head is in this repository
        id: check_head
        run: |
          set -euo pipefail
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.repository }}"
          echo "head=$HEAD_REPO base=$BASE_REPO"
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PR originates from a fork; cannot push bumped versions to the forked branch."
            gh pr comment ${{ github.event.pull_request.number }} --body "Label \\`${{ github.event.label.name }}\\` detected, but this PR originates from a fork. Please add the version bump manually or open the PR from a branch in this repository."
            exit 0
          fi

      - name: Verify label author permission
        id: check_permission
        run: |
          set -euo pipefail
          USER="${{ github.event.sender.login }}"
          PERM=$(gh api repos/${{ github.repository }}/collaborators/$USER/permission --jq .permission)
          echo "actor=$USER permission=$PERM"
          if [ "$PERM" = "admin" ] || [ "$PERM" = "write" ] || [ "$PERM" = "maintain" ]; then
            echo "ok"
          else
            echo "User $USER does not have sufficient repository permission ($PERM); skipping automated bump."
            gh pr comment ${{ github.event.pull_request.number }} --body "Label \\`${{ github.event.label.name }}\\` was added by @$USER but they do not have write/maintain/admin permissions. Automatic version bump skipped."
            exit 0
          fi

      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch PR base branch for diff
        run: |
          set -euo pipefail
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Get PR file list from git diff
        id: pr_files
        run: |
          set -euo pipefail
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | sort > pr-files.txt
          echo "list=$(paste -sd',' pr-files.txt || true)" >> $GITHUB_OUTPUT

      - name: Determine affected publishable packages
        id: detect_pkgs
        run: |
          set -euo pipefail
          PUBLISHABLE=(packages/core packages/types-core packages/dice)
          AFFECTED=()
          while IFS= read -r file; do
            for pkg in "${PUBLISHABLE[@]}"; do
              if [[ "$file" == "$pkg"/* || "$file" == "$pkg" ]]; then
                AFFECTED+=("$pkg")
                break
              fi
            done
          done < pr-files.txt || true

          if printf '%s\n' "${AFFECTED[@]}" | grep -qx "packages/core"; then
            AFFECTED+=("packages/types-core")
          fi

          if [ ${#AFFECTED[@]} -eq 0 ]; then
            echo "No publishable package files changed in this PR; nothing to bump."
            gh pr comment ${{ github.event.pull_request.number }} --body "Label \`${{ github.event.label.name }}\` detected, but no publishable package files changed in this PR. Automatic version bump skipped."
            exit 0
          fi

          UNIQUE=()
          for pkg in "${AFFECTED[@]}"; do
            if ! printf '%s\n' "${UNIQUE[@]}" | grep -Fxq "$pkg"; then
              UNIQUE+=("$pkg")
            fi
          done
          printf '%s\n' "${UNIQUE[@]}" > affected.txt
          echo "affected=$(paste -sd' ' affected.txt)" >> $GITHUB_OUTPUT

      - name: Skip packages where package.json already changed in PR
        id: filter_pkgjson
        run: |
          set -euo pipefail
          if [ ! -f affected.txt ]; then
            echo "affected.txt missing"
            exit 1
          fi

          REMAINING=()
          while IFS= read -r pkg; do
            if grep -q "^${pkg}/package.json$" pr-files.txt; then
              echo "${pkg} already has package.json changes in the PR; skipping bump for that package."
              gh pr comment ${{ github.event.pull_request.number }} --body "${pkg}: package.json is already changed in this PR; automatic semantic bump skipped for this package."
            else
              REMAINING+=("$pkg")
            fi
          done < affected.txt

          if [ ${#REMAINING[@]} -eq 0 ]; then
            echo "No remaining packages to bump." > remaining.txt
            exit 0
          fi
          printf '%s\n' "${REMAINING[@]}" > remaining.txt
          echo "remaining=$(paste -sd' ' remaining.txt)" >> $GITHUB_OUTPUT

      - name: Bump versions in PR branch
        id: do_bump
        run: |
          set -euo pipefail
          if [ ! -s remaining.txt ]; then
            echo "No packages to bump."
            exit 0
          fi

          LABEL=${{ github.event.label.name }}
          case "$LABEL" in
            semver/patch) TYPE=patch ;;
            semver/minor) TYPE=minor ;;
            semver/major) TYPE=major ;;
            *) echo "Unsupported label: $LABEL" ; exit 1 ;;
          esac

          UPDATED=false
          while IFS= read -r pkg; do
            if [ ! -f "$pkg/package.json" ]; then
              echo "Package file missing: $pkg/package.json" >&2
              continue
            fi

            NAME=$(node -p "console.log(require('./${pkg}/package.json').name)")
            echo "Bumping $NAME in $pkg"
            pnpm --filter "$NAME" version "$TYPE" --no-git-tag-version --no-workspaces-update
            git add "$pkg/package.json"
            UPDATED=true
          done < remaining.txt

          if [ "$UPDATED" = "false" ]; then
            echo "No package versions were updated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bump package version(s) ($TYPE) per PR label '${{ github.event.label.name }}'" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Comment on PR with bumped versions
        if: success()
        run: |
          if [ ! -s remaining.txt ]; then
            echo "No bumped packages to report."
            exit 0
          fi

          echo "Bumped packages in this PR per label '${{ github.event.label.name }}':" > comment.md
          while IFS= read -r pkg; do
            VER=$(node -p "require('./${pkg}/package.json').version")
            echo "- ${pkg}: ${VER}" >> comment.md
          done < remaining.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
