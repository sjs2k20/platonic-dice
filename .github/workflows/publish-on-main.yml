name: Publish changed packages on main

on:
  push:
    branches: [main]

  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PUBLISHABLE_PACKAGES: "packages/core packages/types-core packages/dice"
  NPM_REGISTRY: "https://registry.npmjs.org/"

jobs:
  publish:
    name: Publish changed packages
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "8.15.9"
          cache: true

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Determine changed publishable packages
        id: changed_packages
        run: |
          set -euo pipefail
          echo "Comparing files between ${{ github.event.before }} and ${{ github.sha }}"
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt

          PUBLISHABLE=(packages/core packages/types-core packages/dice)
          AFFECTED=()
          while IFS= read -r file; do
            for pkg in "${PUBLISHABLE[@]}"; do
              if [[ "$file" == "$pkg"/* || "$file" == "$pkg" ]]; then
                AFFECTED+=("$pkg")
                break
              fi
            done
          done < changed-files.txt

          if printf '%s\n' "${AFFECTED[@]}" | grep -qx "packages/core"; then
            AFFECTED+=("packages/types-core")
          fi

          UNIQUE=()
          for pkg in "${AFFECTED[@]}"; do
            if ! printf '%s\n' "${UNIQUE[@]}" | grep -Fxq "$pkg"; then
              UNIQUE+=("$pkg")
            fi
          done

          if [ ${#UNIQUE[@]} -eq 0 ]; then
            echo "No publishable package version changes detected."
            exit 0
          fi

          printf '%s\n' "${UNIQUE[@]}" > publish-packages.txt
          echo "packages=$(paste -sd' ' publish-packages.txt)" >> $GITHUB_OUTPUT

      - name: Set up npm auth
        if: env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          printf "//registry.npmjs.org/:_authToken=%s\n" "${NPM_TOKEN}" > ~/.npmrc

      - name: Build changed packages
        if: steps.changed_packages.outputs.packages != ''
        run: |
          set -euo pipefail
          while IFS= read -r pkg; do
            NAME=$(node -p "console.log(require('./${pkg}/package.json').name)")
            echo "Building $NAME"
            pnpm --filter "$NAME" run build --if-present
          done < publish-packages.txt

      - name: Publish changed packages
        if: steps.changed_packages.outputs.packages != ''
        run: |
          set -euo pipefail
          FAILURE_LOG=publish-failures.txt
          : > "$FAILURE_LOG"
          FAILED=0

          while IFS= read -r pkg; do
            PACKAGE_JSON="$pkg/package.json"
            if [ ! -f "$PACKAGE_JSON" ]; then
              echo "Skipping missing package file: $PACKAGE_JSON"
              continue
            fi
            NAME=$(node -p "console.log(require('./${pkg}/package.json').name)")
            VERSION=$(node -p "console.log(require('./${pkg}/package.json').version)")
            PRIVATE=$(node -p "console.log(require('./${pkg}/package.json').private || false)")
            if [ "$PRIVATE" = "true" ]; then
              echo "Skipping private package $NAME"
              continue
            fi
            echo "Publishing $NAME@$VERSION"
            pushd "$pkg" >/dev/null
            if npm publish --registry "$NPM_REGISTRY" --access public; then
              echo "Published $NAME@$VERSION"
            else
              echo "Publish failed for $NAME@$VERSION"
              if npm view "$NAME@$VERSION" --registry "$NPM_REGISTRY" >/dev/null 2>&1; then
                echo "$NAME@$VERSION already exists on npm; skipping."
              else
                echo "Failed to publish $NAME@$VERSION" >> "$FAILURE_LOG"
                FAILED=1
              fi
            fi
            popd >/dev/null
          done < publish-packages.txt

          if [ "$FAILED" -ne 0 ]; then
            echo "Publish failures detected:"
            cat "$FAILURE_LOG"
            exit 1
          fi

      - name: Notify on publish failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.GITHUB_SHA;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = `Publish failed on main`;
            const body = `The publish workflow failed for main at commit \`${sha}\`.

            See the failed workflow run: ${runUrl}

            Fix the publishing issue (for example, rotate or update \`NPM_TOKEN\`) and rerun this workflow manually using the "Run workflow" button.`;
            const openIssues = await github.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['publish-failure'],
              per_page: 100
            });
            const existing = openIssues.data.find(issue => issue.title === title);
            if (existing) {
              await github.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The publish workflow failed again for commit \`${sha}\`.

                See the new failed workflow run: ${runUrl}`
              });
            } else {
              await github.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['publish-failure']
              });
            }
