name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: lint
    if: >
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.12.0 --activate
      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile
      - name: Lint
        run: pnpm -r --if-present lint

  typecheck:
    name: typecheck
    if: >
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.12.0 --activate
      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -w --if-present build
      - name: Typecheck
        run: |
          set -euo pipefail
          found=0
          for dir in packages/*; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Typechecking $dir"
              npx -y tsc -p "$dir/tsconfig.json" --noEmit
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No tsconfig.json files found; skipping."
          fi

  test:
    name: test
    if: >
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@11.12.0 --activate
      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm -w --if-present build
      - name: Test
        run: pnpm -r --if-present test
