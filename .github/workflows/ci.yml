name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: CI — lint / typecheck / test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: "8.15.9"
          cache: true

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Lint (run in all packages that expose a lint script)
        run: pnpm -r --if-present lint

      - name: Build workspace packages (produce type declarations)
        run: pnpm -w --if-present build

      - name: Typecheck (runs tsc --noEmit for packages that have a tsconfig.json)
        run: |
          set -euo pipefail
          echo "Looking for packages with tsconfig.json..."
          found=0
          for dir in packages/*; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Found tsconfig in $dir, running tsc --noEmit"
              npx -y tsc -p "$dir/tsconfig.json" --noEmit
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No package tsconfig.json files found; skipping typecheck step."
          fi

      - name: Run tests (root test script runs tests across workspace)
        run: pnpm -r --if-present test
