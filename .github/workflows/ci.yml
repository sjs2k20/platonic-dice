name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

# Shared condition: always run on PRs; skip the bot's own bump commit on push.
# 'head_commit' is only set on push events, so the PR branch of the OR ensures
# this condition is always true for pull_request triggers.
x-skip-guard: &skip-guard >
  github.event_name == 'pull_request' ||
  !startsWith(github.event.head_commit.message, 'chore(release):')

# Shared setup steps reused across jobs via YAML anchors.
x-setup: &setup
  - uses: actions/checkout@v4
    with:
      fetch-depth: 0
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "24"
  - name: Setup pnpm
    uses: pnpm/action-setup@v2
    with:
      version: "8.15.9"
      cache: true
  - name: Install dependencies
    run: pnpm -w install --frozen-lockfile

jobs:
  lint:
    name: lint
    if: *skip-guard
    runs-on: ubuntu-latest
    steps:
      - *setup
      - name: Lint
        run: pnpm -r --if-present lint

  typecheck:
    name: typecheck
    if: *skip-guard
    runs-on: ubuntu-latest
    steps:
      - *setup
      - name: Build workspace packages
        run: pnpm -w --if-present build
      - name: Typecheck
        run: |
          set -euo pipefail
          found=0
          for dir in packages/*; do
            if [ -f "$dir/tsconfig.json" ]; then
              echo "Typechecking $dir"
              npx -y tsc -p "$dir/tsconfig.json" --noEmit
              found=1
            fi
          done
          [ "$found" -eq 0 ] && echo "No tsconfig.json files found; skipping."

  test:
    name: test
    if: *skip-guard
    runs-on: ubuntu-latest
    steps:
      - *setup
      - name: Test
        run: pnpm -r --if-present test
